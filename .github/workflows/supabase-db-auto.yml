name: supabase-db-auto

# Applies repo migrations to the production database (forward-only) and
# commits regenerated TypeScript types back to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-db-auto.yml"

permissions:
  contents: write

# Never run two database pushes at the same time; queue them instead.
concurrency:
  group: supabase-db
  cancel-in-progress: false

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the types commit can rebase onto main

      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}" || { echo "ERR: SUPABASE_DB_URL missing"; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "ERR: SUPABASE_ACCESS_TOKEN missing"; exit 1; }

      - name: Read Supabase CLI version from package.json
        id: cli
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase.replace(/^[^0-9]*/, '')")" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}

      # Forward-only: never use --include-all on production.
      - name: Apply repo migrations
        run: supabase db push --db-url "${SUPABASE_DB_URL}" --yes

      - name: Generate TypeScript types
        run: |
          set -euo pipefail
          mkdir -p src/lib
          supabase gen types typescript \
            --db-url "${SUPABASE_DB_URL}" \
            -s public -s auth -s storage > src/lib/database.types.ts

      # [skip ci] on the commit prevents this workflow from re-triggering itself.
      - name: Commit & push types (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/database.types.ts
          git diff --cached --quiet && { echo "No type changes"; exit 0; }
          git commit -m "chore(types): regenerate DB types [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
